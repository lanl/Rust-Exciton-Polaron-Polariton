[workspace]
members = [
  "sim-common",
  "exciton_2d",
  "light-matter",
]
resolver = "3"

[workspace.dependencies]
ndarray-linalg = { version = "0.18.1", features = ["intel-mkl-static"] }
ndarray = { version = "0.17.2", features = ["rayon"] }
sprs = "0.11.4"
indicatif = { version = "0.18", features = ["rayon"] }
plotters = "0.3"
rayon = "1.12"
num-complex = "0.4"
num-traits = "0.2"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rand = "0.9"
chrono = "0.4"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
