[package]
name = "light-matter"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true

[dependencies]
indicatif = { version = "0.18", features = ["rayon"] } 
ndarray = { version = "0.16.1", features = ["rayon"] }
ndarray-linalg = { workspace = true }
sprs = "0.11"
plotters = "0.3"
rayon = "1.7"
num-complex = "0.4"
num-traits = "0.2"
log = "0.4"
env_logger = "0.11.8"
anyhow = "1.0"
thiserror = "2.0.16"
clap = { version = "4.3", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ordered-float = "5.0.0"
exciton_2d = { path = "../exciton_2d"}
bincode = "1.3"
arpack-ng-sys = { path = "../../crates/arpack-ng-sys" }
arpack = { path = "../../crates/arpack" }
rand = "0.9.2"
scilib = "1.0.0"
num_threads = "0.1.7"
num_cpus = "1.17.0"
rust_slepc_bindings = {path = "../slepc_rust"}
