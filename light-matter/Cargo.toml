[package]
name = "light-matter"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[dependencies]
indicatif = { version = "0.18", features = ["rayon"] } 
ndarray = {  workspace = true }
ndarray-linalg = { workspace = true }
sprs = "0.11.4"
plotters = "0.3"
rayon = "1.7"
num-complex = "0.4"
num-traits = "0.2"
log = "0.4"
env_logger = "0.11.8"
anyhow = "1.0"
thiserror = "2.0.16"
clap = { version = "4.3", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ordered-float = "5.0.0"
exciton_2d = { path = "../exciton_2d"}
bincode = "1.3.3"
rand = "0.9.2"
scilib = "1.0.0"
num_threads = "0.1.7"
num_cpus = "1.17.0"
matrix-ops = {path = "/vast/home/mike_tay/matrix_ops"}
slepc-rs = {path = "/vast/home/mike_tay/slepc_rust"}
chrono = "0.4"
colored ="3.0.0"

