[package]
name = "exciton_2d"
version = "0.1.0"
edition = "2021"

[profile.release]
debug = true


[dependencies]
indicatif = { version = "0.18", features = ["rayon"] } 
ndarray = { version = "0.16.1", features = ["rayon"] }
ndarray-linalg = { version = "0.17.0", features = ["openblas-system"] }
sprs = "0.11"
plotters = "0.3"
rayon = "1.7"
num-complex = "0.4"
num-traits = "0.2"
log = "0.4"
env_logger = "0.11.8"
anyhow = "1.0"
thiserror = "2.0.16"
clap = { version = "4.3", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ordered-float = "5.0.0"

[patch.crates-io]
arpack-ng-sys = { version = "0.2.1", features = ["system"] }


[[bin]]
name = "exciton_2d"
path = "src/bin/main.rs"
