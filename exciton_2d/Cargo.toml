[package]
name = "exciton_2d"
version = "0.1.0"
edition = "2024"

[dependencies]
slepc-rs = { path = "../slepc_rust" }
matrix-ops = { path = "../matrix_ops" }
sprs = "*"
indicatif = { version = "0.18", features = ["rayon"] } 
ndarray = { workspace = true }
ndarray-linalg = { workspace = true }
plotters = "0.3"
rayon = "1.12.0"
num-complex = "0.4"
num-traits = "0.2"
log = "0.4.32"
env_logger = "0.11.8"
anyhow = "1.0"
thiserror = "2.0.18"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
ordered-float = "5.3.0"
bincode = "1.3"

[[bin]]
name = "exciton_2d"
path = "src/bin/main.rs"
[[example]]
name = "simple"
path = "examples/simple.rs"
